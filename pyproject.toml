[project]
name = "trading-bot"
version = "0.1.0"
description = "Statistical-arbitrage crypto trading system (CCXT / Binance USDT-M Futures)"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.3.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.4.0",
    "python-dotenv>=1.0.1",
    "matplotlib>=3.8.0",
    "tqdm>=4.66.0",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
ml = [
    "torch>=2.3.0",
]

[tool.uv]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "execution"]
