[project]
name = "trading-bot"
version = "0.1.0"
description = "Statistical-arbitrage crypto trading system (CCXT / Binance USDT-M Futures)"
requires-python = ">=3.11,<3.14"  # torch CUDA wheels for the RTX 3070 don't yet ship cp314 wheels
dependencies = [
    "ccxt>=4.3.0",
    "pandas>=2.2.0,<3.0",
    "numpy>=1.26.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.4.0",
    "python-dotenv>=1.0.1",
    "matplotlib>=3.8.0",
    "tqdm>=4.66.0",
    "yfinance>=0.2.40",
    "pyyaml>=6.0",
    "pyarrow>=15.0.0",
    "streamlit>=1.37.0",
]

[project.optional-dependencies]
ml = [
    "torch==2.6.0+cu124",
]
foundation = [
    "chronos-forecasting>=2.3.2",
]

[tool.uv]
index-strategy = "unsafe-best-match"

[tool.uv.sources]
# Only torch is required for this TCN project. torchvision/torchaudio are not
# imported anywhere in the codebase and are intentionally not forced into the
# ML extra to avoid the CPU-only/PyPI resolution conflicts on Windows.
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true


[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "execution"]
