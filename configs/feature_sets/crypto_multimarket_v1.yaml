feature_set_id: crypto_multimarket_v1
version: 1.0.0
targets: [BTC/USDT, ETH/USDT]
context_assets: [BTC/USDT, ETH/USDT, SOL/USDT, SPY, QQQ, DAX, GOLD, VIX, US10Y, EURUSD, WTI]
observation_timeframes: [15m, 30m, 1h, 2h, 4h, 8h, 12h, 1d]
feature_groups:
  target_local: [returns, momentum, trend, volatility, volume, structure]
  cross_crypto: [return_1, relative_strength, volatility, correlation]
  cross_market: [return_1, momentum, volatility, trend, range_position]
lookbacks:
  returns: [1, 3, 6, 12, 24]
  momentum: [6, 12, 24]
  rsi: [14]
  moving_average: [20, 50]
  volatility: [12, 24, 48]
  volume: [24]
  structure: [20, 55]
alignment:
  direction: backward
  availability_rule: closed_candle
  availability_lag_minutes: 0
  max_staleness_minutes: 2880
normalization:
  method: train_only_standard_scaler
missing_data:
  context: retain_nan_then_drop_rows
  target: insufficient_data
  minimum_context_assets: 0
labels: [future_return, direction]